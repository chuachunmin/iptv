<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist M3U Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for a cleaner look */
        .playlist-container::-webkit-scrollbar {
            width: 6px;
        }
        .playlist-container::-webkit-scrollbar-track {
            background: #2d3748; /* bg-gray-800 */
        }
        .playlist-container::-webkit-scrollbar-thumb {
            background: #4a5568; /* bg-gray-600 */
            border-radius: 3px;
        }
        .playlist-container::-webkit-scrollbar-thumb:hover {
            background: #718096; /* bg-gray-500 */
        }
        .active-playlist-item {
            background-color: #4a5568; /* A subtle highlight for the active item */
        }
    </style>
</head>
<body class="bg-gray-900 text-white antialiased">

    <!-- 
      Flex container for the main layout.
      - `flex-col` for portrait mode (default)
      - `lg:flex-row` for landscape mode (on large screens and up)
    -->
    <div class="flex flex-col lg:flex-row h-screen bg-gray-900">

        <!-- Video Player Section -->
        <div class="w-full lg:w-2/3 lg:h-full h-1/2 flex-shrink-0 bg-black flex items-center justify-center">
            <!-- Added the 'muted' attribute to allow autoplay on page load -->
            <video id="videoPlayer" class="w-full h-full" controls muted></video>
        </div>

        <!-- Playlist Section -->
        <div class="w-full lg:w-1/3 lg:h-full h-1/2 flex flex-col border-l border-gray-700">
            <header class="p-4 bg-gray-800 border-b border-gray-700 flex-shrink-0">
                <h1 class="text-xl font-semibold">Playlist</h1>
            </header>
            <div id="playlist" class="playlist-container overflow-y-auto flex-grow p-2">
                <!-- Playlist items will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        // --- Playlist Data ---
        // To use your own playlist, replace the content of this playlistData variable.
        // Keep the backticks (` `) around the content.
        // Format (one URL per line):
        // 1. [Stream Name],[URL]  (e.g., Big Buck Bunny,http://...)
        // 2. [URL]                 (will be auto-named "Stream X")
        const rawPlaylist = `
Channel News Asia,https://mediacorp-videosbclive.akamaized.net/8a496e61361c4079a0e16d8f09e79df9/ap-southeast-1/6057994443001/playlist.m3u8
Japan,https://raw.githubusercontent.com/luongz/iptv-jp/refs/heads/main/jp_clean.m3u
        `;
        // --- End of Playlist Data ---


        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            const playlistContainer = document.getElementById('playlist');
            let hls;

            // Function to parse the simple playlist content (one URL per line)
            function parsePlaylist(rawContent) {
                const lines = rawContent.trim().split('\n').filter(line => line.trim() !== '');
                const playlistItems = lines.map((line, index) => {
                    const parts = line.split(',');
                    let title, url;

                    if (parts.length > 1 && (parts[parts.length - 1].startsWith('http://') || parts[parts.length - 1].startsWith('https://'))) {
                        // Format: "Title,http://url"
                        title = parts.slice(0, -1).join(',').trim(); // Handle commas in title
                        url = parts[parts.length - 1].trim();
                    } else {
                        // Format: "http://url"
                        title = `Stream ${index + 1}`; // Auto-numbering
                        url = line.trim();
                    }

                    return { title, url };
                });
                return playlistItems;
            }

            // Function to load a video into the player
            function loadVideo(url) {
                if (hls) {
                    hls.destroy();
                }

                // A helper function to safely play the video and handle promise rejections
                const safePlay = () => {
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // This catch block prevents the "UNHANDLEDREJECTION" error.
                            console.error("Autoplay was prevented:", error);
                        });
                    }
                };

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        safePlay();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', function() {
                        safePlay();
                    });
                }
            }
            
            // Function to highlight the currently playing item
            function setActivePlaylistItem(index) {
                const items = playlistContainer.querySelectorAll('.playlist-item');
                items.forEach((item, i) => {
                    item.classList.toggle('active-playlist-item', i === index);
                    item.classList.toggle('bg-gray-700', i !== index);
                });
            }

            // Main function to initialize the player and playlist
            function initializePlayer() {
                const playlistData = parsePlaylist(rawPlaylist);
                
                if (playlistData.length === 0) {
                    playlistContainer.innerHTML = '<p class="text-gray-400 p-4">No channels found in the playlist.</p>';
                    return;
                }

                // Populate the playlist in the UI
                playlistContainer.innerHTML = playlistData.map((item, index) => `
                    <div class="playlist-item flex items-center p-3 rounded-lg cursor-pointer hover:bg-gray-600 transition-colors duration-200" data-url="${item.url}" data-index="${index}">
                        <div class="text-gray-400 w-8 text-center font-mono text-sm">${index + 1}.</div>
                        <div class="flex-grow text-white">${item.title}</div>
                    </div>
                `).join('');

                // Add click event listeners to each playlist item
                const items = playlistContainer.querySelectorAll('.playlist-item');
                items.forEach(item => {
                    item.addEventListener('click', () => {
                        const url = item.getAttribute('data-url');
                        const index = parseInt(item.getAttribute('data-index'), 10);
                        video.muted = false; // Unmute on user interaction
                        loadVideo(url);
                        setActivePlaylistItem(index);
                    });
                });

                // Load the first video by default
                loadVideo(playlistData[0].url);
                setActivePlaylistItem(0);
            }
            
            initializePlayer();
        });

    </script>
</body>
</html>
